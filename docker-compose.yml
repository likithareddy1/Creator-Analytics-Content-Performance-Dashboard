version: '3.8'

services:
  db:
    image: postgres:16
    container_name: creator_analytics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abc123
      POSTGRES_DB: creator_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: python:3.11
    working_dir: /app
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db

volumes:
  postgres_data:
